<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 90vh; }
        .container { max-width: 600px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; flex-grow: 1; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; box-sizing: border-box; }
        .config-box { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee; display: flex; gap: 10px; }
        .config-box input { flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        .chat-box { flex-grow: 1; overflow-y: auto; padding: 10px; border: 1px solid #eee; border-radius: 5px; margin-bottom: 15px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 10px; border-radius: 8px; max-width: 80%; }
        .user { background: #007bff; color: white; align-self: flex-end; margin-left: auto; }
        .ai { background: #e9ecef; color: #333; }
        .input-box { display: flex; gap: 10px; }
        .input-box input { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .input-box button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>🤖 Personal AI Companion</h2>
    
    <!-- 1. The Single Place for the API Key -->
    <div class="config-box">
        <input type="password" id="apiKey" placeholder="Paste your Gemini API Key here...">
    </div>

    <!-- Chat display -->
    <div class="chat-box" id="chatBox">
        <div class="message ai">Hello! Enter your API key above, then ask me anything about work, home, or life.</div>
    </div>

    <!-- Message input -->
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Type a task or question..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // 2. Chat history memory array
    let chatHistory = [];

    async function sendMessage() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const userInputField = document.getElementById('userInput');
        const userText = userInputField.value.trim();
        const chatBox = document.getElementById('chatBox');

        if (!apiKey) { alert('Please enter your API key first!'); return; }
        if (!userText) return;

        // Display user message
        chatBox.innerHTML += `<div class="message user">${userText}</div>`;
        userInputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Add to history log
        chatHistory.push({ role: "user", parts: [{ text: userText }] });

        try {
            // 3. Direct secure browser-to-API connection
            const response = await fetch(`https://googleapis.com{apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: chatHistory,
                    systemInstruction: {
                        parts: [{ text: "You are an all-in-one personal AI companion. Help with work, home, and life. Use short bullet points and emojis." }]
                    }
                })
            });

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;

            // Display AI message
            chatBox.innerHTML += `<div class="message ai">${aiText}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // Add AI response to history
            chatHistory.push({ role: "model", parts: [{ text: aiText }] });

        } catch (error) {
            chatBox.innerHTML += `<div class="message ai" style="color:red;">Error connecting to Gemini. Check your key.</div>`;
        }
    }
</script>

</body>
</html>
